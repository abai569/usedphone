name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Validate API URL
        shell: bash
        run: |
          [[ "${API_BASE_URL}" == https://* ]] || { echo "API_BASE_URL must start with https://"; exit 1; }
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/key.p12
          test -s android/app/key.p12
          cat > android/app/key.properties <<EOF
          storeFile=key.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeType=pkcs12
          EOF
          test -s android/app/key.properties
          grep -q '^storeFile=key.p12$' android/app/key.properties
      - run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - name: Rename APKs
        shell: bash
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            dst="build/app/outputs/flutter-apk/usedphone-${GITHUB_REF_NAME}-${abi}.apk"
            if [ -f "$src" ]; then
              mv "$src" "$dst"
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/usedphone-${{ github.ref_name }}-*.apk
